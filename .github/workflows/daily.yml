name: 부동산 경기 대시보드 + 뉴스브리핑 자동 생성

on:
  schedule:
    # 매일 08:00 ~ 22:00 KST, 1시간 간격 (총 15회/일)
    - cron: '0 23,0-13 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.12 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 설치
        run: |
          pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 lxml

      - name: 현재 KST 시각 확인
        id: kst
        run: |
          HOUR=$(TZ='Asia/Seoul' date +%H)
          echo "hour=$HOUR" >> "$GITHUB_OUTPUT"
          if [ "$HOUR" = "08" ]; then
            echo "is_morning=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_morning=false" >> "$GITHUB_OUTPUT"
          fi
          echo "현재 KST 시각: ${HOUR}시"

      - name: 이전 지표 스냅샷 백업
        run: |
          mkdir -p data
          if [ -f data/indicators.json ]; then
            cp data/indicators.json data/indicators_prev.json
            echo "이전 지표 백업 완료"
          else
            echo "이전 지표 없음 (최초 실행)"
          fi

      - name: 부동산 경기 지표 대시보드 생성
        env:
          ECOS_API_KEY: ${{ secrets.BOK_ECOS_KEY }}
          KOSIS_API_KEY: ${{ secrets.DATA_PORTAL_KEY }}
          RONE_API_KEY: ${{ secrets.REB_API_KEY }}
          HOUSTAT_API_KEY: ${{ secrets.HOUSTAT_API_KEY }}
        run: |
          echo "=== realestate_dashboard.py 실행 ==="
          python realestate_dashboard.py
        continue-on-error: true

      - name: 부동산 뉴스브리핑 생성 (08시 1일 1회)
        if: steps.kst.outputs.is_morning == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
        run: |
          echo "=== generate_news_modular.py 실행 ==="
          python generate_news_modular.py
        continue-on-error: true

      - name: 이메일/슬랙 알림 발송
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "=== notify.py 실행 ==="
          python notify.py
        continue-on-error: true

      - name: index.html 생성 (네비게이션 포함)
        run: |
          python - << 'EOF'
          import os
          from datetime import datetime, timezone, timedelta

          KST = timezone(timedelta(hours=9))
          now = datetime.now(KST).strftime("%Y년 %m월 %d일 %H:%M KST")

          has_dashboard = os.path.exists("realestate_dashboard.html")
          has_news = os.path.exists("index.html")

          html = f"""<!DOCTYPE html>
          <html lang="ko">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="refresh" content="0; url=realestate_dashboard.html">
          <title>부동산 정보 센터</title>
          <style>
            body {{ font-family: 'Malgun Gothic', sans-serif; background: #0f1923; color: #cfd8dc;
                   display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }}
            .box {{ text-align: center; padding: 40px; }}
            h1 {{ color: #4fc3f7; font-size: 24px; margin-bottom: 8px; }}
            .upd {{ color: #546e7a; font-size: 12px; margin-bottom: 32px; }}
            .links {{ display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }}
            a.btn {{ display: block; padding: 16px 28px; border-radius: 8px; text-decoration: none;
                    font-weight: 700; font-size: 15px; transition: opacity .2s; }}
            a.btn:hover {{ opacity: .8; }}
            .blue {{ background: #1565c0; color: #fff; }}
            .dark {{ background: #132030; color: #4fc3f7; border: 1px solid #1e3a5f; }}
          </style>
          </head>
          <body>
          <div class="box">
            <h1>🏠 부동산 정보 센터</h1>
            <div class="upd">마지막 업데이트: {now}</div>
            <div class="links">
              <a class="btn blue" href="realestate_dashboard.html">📊 경기 지표 대시보드</a>
              <a class="btn dark" href="index.html">📰 부동산 뉴스브리핑</a>
            </div>
          </div>
          </body>
          </html>"""

          with open("home.html", "w", encoding="utf-8") as f:
              f.write(html)
          print("home.html 생성 완료")
          EOF

            - name: 결과물 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f realestate_dashboard.html ] && git add -f realestate_dashboard.html
          [ -f home.html ] && git add -f home.html
          [ -f index.html ] && git add -f index.html
          [ -f data/indicators.json ] && git add -f data/indicators.json
          [ -f data/indicators_history.json ] && git add -f data/indicators_history.json
          git diff --staged --quiet || git commit -m "🤖 자동 업데이트: $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
